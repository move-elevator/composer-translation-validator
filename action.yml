name: 'Composer Translation Validator'
description: 'Validate translation files (XLIFF, YAML, JSON, PHP) using the composer-translation-validator PHAR'
author: 'move-elevator'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'Release tag to use (e.g. "1.6.0"). Defaults to the latest release.'
    required: false
    default: 'latest'
  args:
    description: 'Arguments passed to the PHAR, e.g. paths and options.'
    required: false
    default: '.'
  working-directory:
    description: 'Directory the PHAR is executed in.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Download PHAR
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$VERSION" = "latest" ]; then
          base_url="https://github.com/move-elevator/composer-translation-validator/releases/latest/download"
        else
          base_url="https://github.com/move-elevator/composer-translation-validator/releases/download/${VERSION}"
        fi
        curl -fsSL -o "${{ runner.temp }}/composer-translation-validator.phar" "${base_url}/composer-translation-validator.phar"
        curl -fsSL -o "${{ runner.temp }}/composer-translation-validator.phar.sha256" "${base_url}/composer-translation-validator.phar.sha256"

    - name: Verify checksum
      shell: bash
      working-directory: ${{ runner.temp }}
      run: sha256sum -c composer-translation-validator.phar.sha256

    - name: Run validator
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
      run: |
        chmod +x "${{ runner.temp }}/composer-translation-validator.phar"
        php "${{ runner.temp }}/composer-translation-validator.phar" $ARGS
